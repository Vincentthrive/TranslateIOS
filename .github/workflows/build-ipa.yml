name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Prewarm iPad Simulator
        run: |
          runtime=$(xcrun simctl list runtimes iOS -j | python3 -c "
          import json,sys
          for r in json.load(sys.stdin)['runtimes']:
              if r['isAvailable']:
                  print(r['identifier'])
                  break
          ")
          devicetype=$(xcrun simctl list devicetypes "iPad " -j | python3 -c "
          import json,sys
          types = json.load(sys.stdin)['devicetypes']
          print(types[-1]['identifier'])
          ")
          echo "Runtime: $runtime"
          echo "DeviceType: $devicetype"
          xcrun simctl create "CI_iPad" "$devicetype" "$runtime" 2>/dev/null || true
          xcrun simctl boot "CI_iPad" 2>/dev/null || true
          echo "SIMULATOR_DEVICE=CI_iPad" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          unzip -o xcodegen.zip
          chmod +x xcodegen
          echo "$PWD" >> $GITHUB_PATH
          ./xcodegen --version

      - name: Generate project
        run: ./xcodegen generate

      - name: Run tests
        run: |
          xcodebuild test -project CaptionSubtitle.xcodeproj \
            -scheme CaptionSubtitle \
            -destination "platform=iOS Simulator,name=$SIMULATOR_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          xcodebuild -project CaptionSubtitle.xcodeproj \
            -scheme CaptionSubtitle \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP=$(find build -name "CaptionSubtitle.app" -type d | head -1)
          echo "Found app at: $APP"
          cp -R "$APP" Payload/
          zip -r CaptionSubtitle-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: caption-subtitle-unsigned
          path: CaptionSubtitle-unsigned.ipa
