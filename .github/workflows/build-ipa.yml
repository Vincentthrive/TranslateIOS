name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Boot iPad Simulator
        run: |
          xcrun simctl boot "iPad (10th generation)" 2>/dev/null || true
          echo "SIM_DEVICE=iPad (10th generation)" >> $GITHUB_ENV

      - name: Install XcodeGen
        run: |
          curl -sSL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
          echo "=== zip contents ==="
          unzip -l xcodegen.zip
          unzip -o xcodegen.zip
          ls -la
          chmod +x xcodegen/bin/xcodegen
          xattr -d com.apple.quarantine xcodegen/bin/xcodegen 2>/dev/null || true
          ln -sf xcodegen/bin/xcodegen xg
          echo "$PWD" >> $GITHUB_PATH
          ./xg --version

      - name: Generate project
        run: ./xg generate

      - name: Run tests
        run: |
          xcodebuild test -project CaptionSubtitle.xcodeproj \
            -scheme CaptionSubtitle \
            -destination "platform=iOS Simulator,name=$SIM_DEVICE" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          xcodebuild -project CaptionSubtitle.xcodeproj \
            -scheme CaptionSubtitle \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP=$(find build -name "CaptionSubtitle.app" -type d | head -1)
          echo "Found app at: $APP"
          cp -R "$APP" Payload/
          zip -r CaptionSubtitle-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: caption-subtitle-unsigned
          path: CaptionSubtitle-unsigned.ipa
